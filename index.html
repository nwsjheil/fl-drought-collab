<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Collaborative Drought Analysis · Available Analyses</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #100e0c;
      color: #f4efe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(circle at 50% 10%, rgba(109,64,37,.30) 0%, rgba(24,21,18,0) 38%),
        linear-gradient(180deg, #181512 0%, #100e0c 100%);
    }
    .launcher {
      width: min(620px, 100%);
      border: 1px solid #59493d;
      border-radius: 16px;
      background: #211c18;
      box-shadow: 0 24px 80px rgba(0,0,0,.48);
      overflow: hidden;
    }
    .head { padding: 26px 28px 22px; border-bottom: 1px solid #463a31; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand img { width: 48px; height: 48px; object-fit: contain; }
    .kicker { color: #c86f32; font-size: 10px; font-weight: 900; letter-spacing: 1.1px; }
    h1 { margin: 5px 0 0; font-size: 23px; line-height: 1.15; }
    .sub { margin: 12px 0 0; color: #b9aa9b; font-size: 13px; line-height: 1.5; }
    .body { padding: 20px 28px 27px; }
    .section-title { margin: 0 0 10px; color: #d7cbc0; font-size: 11px; font-weight: 900; letter-spacing: .7px; text-transform: uppercase; }
    .cycle-list { display: grid; gap: 8px; }
    .cycle-link {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 13px;
      border: 1px solid #514238;
      border-radius: 9px;
      background: #191613;
      color: #f4efe9;
      text-decoration: none;
      transition: border-color .12s ease, background .12s ease, transform .12s ease;
    }
    .cycle-link:hover, .cycle-link:focus-visible {
      border-color: #b85e2a;
      background: #2b211b;
      transform: translateY(-1px);
      outline: none;
    }
    .cycle-date { font-size: 14px; font-weight: 850; }
    .cycle-meta { margin-top: 2px; color: #9f9084; font-size: 10px; font-weight: 750; }
    .open { color: #e09a6d; font-size: 11px; font-weight: 900; white-space: nowrap; }
    .latest {
      display: inline-flex;
      margin-left: 7px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #314c38;
      color: #c8e0cd;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .5px;
      vertical-align: 1px;
    }
    .empty {
      padding: 16px;
      border: 1px dashed #514238;
      border-radius: 9px;
      color: #a99a8d;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
    .note { margin: 16px 0 0; color: #8f8176; font-size: 10px; line-height: 1.5; }
    @media (max-width: 520px) {
      .head, .body { padding-left: 20px; padding-right: 20px; }
      .brand img { width: 42px; height: 42px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="launcher">
    <section class="head">
      <div class="brand">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/US-NationalWeatherService-Logo.svg" alt="National Weather Service">
        <div>
          <div class="kicker">COLLABORATIVE DROUGHT ANALYSIS</div>
          <h1>Read-Only External Viewer</h1>
        </div>
      </div>
      <p class="sub">Choose an available Tuesday analysis. The access key is requested only after you open the selected map.</p>
    </section>
    <section class="body">
      <div class="section-title">Available analyses</div>
      <div id="cycleList" class="cycle-list"></div>
      <p class="note">Only Tuesdays with at least one successfully published submission appear here.</p>
    </section>
  </main>

<script>
const AVAILABLE_CYCLES = ["2026-09-01"];

function formatCycleDate(value) {
  const parts = String(value || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(part => !Number.isFinite(part))) return String(value || '');
  const date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12));
  return new Intl.DateTimeFormat('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
  }).format(date);
}

const list = document.getElementById('cycleList');
if (!Array.isArray(AVAILABLE_CYCLES) || !AVAILABLE_CYCLES.length) {
  list.innerHTML = '<div class="empty">No submitted analyses have been published yet.</div>';
} else {
  AVAILABLE_CYCLES.forEach((cycle, index) => {
    const link = document.createElement('a');
    link.className = 'cycle-link';
    link.href = `${encodeURIComponent(cycle)}.html`;

    const left = document.createElement('div');
    const date = document.createElement('div');
    date.className = 'cycle-date';
    date.textContent = formatCycleDate(cycle);
    if (index === 0) {
      const badge = document.createElement('span');
      badge.className = 'latest';
      badge.textContent = 'LATEST';
      date.appendChild(badge);
    }
    const meta = document.createElement('div');
    meta.className = 'cycle-meta';
    meta.textContent = cycle;
    left.append(date, meta);

    const open = document.createElement('span');
    open.className = 'open';
    open.textContent = 'View Analysis →';

    link.append(left, open);
    list.appendChild(link);
  });
}
</script>
</body>
</html>
